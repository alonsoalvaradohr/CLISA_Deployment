# CLISA Network Hardening & TCP Performance Profile (BBR + SYN Defense)
# Designed for Linux Kernel 7.x + High Throughput R&D Workstation

# 1. Congestion Control (BBR + FQ Queue Scheduler)
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# 2. SYN Flood Mitigation & Buffer Optimization
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_max_syn_backlog = 8192
net.core.somaxconn = 8192

# 3. IP Spoofing Protection (Reverse Path Filtering)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# 4. TCP Fast Open (Client & Server)
net.ipv4.tcp_fastopen = 3

# 5. Socket Buffer Max Tuning (64MB max for heavy datasets)
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65536 67108864
